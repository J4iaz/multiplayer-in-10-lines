services:
  - type: web
    name: nexusmeet
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ROOM_TTL_MINUTES
        value: "60"
      - key: ALLOW_GUESTS
        value: "true"
      - key: MAX_VIDEO_PEERS
        value: "6"
      - key: STUN_URLS
        value: "stun:stun.l.google.com:19302"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false